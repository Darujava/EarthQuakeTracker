<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
     stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"
     role="img" aria-label="DARU-net">
  <!--
    フクロウ。夜通し見張る鳥で、24時間動かし続ける観測卓の役どころに合う。

    目は**そのまま波の輪**にしてある。中心の点が震源、外側の2重の輪がP波とS波で、
    地図に出している予想到達円と同じ形。飾りでフクロウを置いたのではなく、
    この画面が出しているものを顔にしている。

    22pxで表示されるので、細部は入れない。輪郭・耳・2つの輪・くちばしだけ。
  -->
